apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: grafana
    folders: grafana
  name: grafana
  namespace: grafana

spec:
  config:
    auth:
      disable_login_form: 'false'
    log:
      mode: console
    security:
      admin_password: password
      admin_user: root
  route:
    spec:
      host: grafana-route-grafana.apps.s2sysocs.fnfis.com
      tls:
        termination: edge
      to:
        kind: Service
        name: grafana-service
        weight: 100
  version: 10.4.3