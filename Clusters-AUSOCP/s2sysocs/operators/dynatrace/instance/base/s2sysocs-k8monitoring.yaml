apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: s2sysocs-k8monitoring
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/automatic-kubernetes-api-monitoring: "true"

spec:
  apiUrl: https://kfu13300.live.dynatrace.com/api
  
  tokens: dynakube
  networkZone: s2sysocs-nz

  trustedCAs: dynatrace-service-ca

  proxy:
    value: http://10.56.24.125:10022

  metadataEnrichment:
    enabled: true
    namespaceSelector:
      matchExpressions:
        - key: dynatrace.com/ignore
          operator: Exists

  activeGate:
    group: s2sysocs-group
    capabilities:
      - kubernetes-monitoring
      - dynatrace-api

    resources:
      requests:
        cpu: 800m
        memory: 5Gi
      limits:
        cpu: 1000m
        memory: 6Gi
